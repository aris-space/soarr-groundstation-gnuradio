id: soarr_sdls_authentication
label: SDLS Authentication
category: '[soarr]/SDLS'

templates:
  imports: from gnuradio import soarr
  make: soarr.sdls_authentication(${authentication_state}, bytes.fromhex('{:028x}'.format(${nonce_hex})))

parameters:
- id: authentication_state
  label: Authentication State
  dtype: enum
  options: ['True', 'False']
  option_labels: [Enabled, Disabled]
  default: 'True'
- id: nonce_hex
  label: Nonce
  dtype: int
  default: 0

asserts:
- ${ nonce_hex >= 0 and nonce_hex <= 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFF }

inputs:
- label: in
  domain: message
  optional: 0

outputs:
- label: out
  domain: message
  optional: 0

documentation: |-
  Appends a 16-byte AES-CMAC authentication tag (CCSDS 355.0-B-1 SDLS) computed over nonce + SDLS counter + payload.

  Ports:
  - in: encrypted payload with auth_key and sdls_counter in the metadata, from sdls_encryption.
  - out: payload + tag, for sdls_header. auth_key is removed from the metadata.

file_format: 1
