id: soarr_lfsr_scrambler
label: LFSR Scrambler
category: '[soarr]/LFSR'

templates:
  imports: from gnuradio import soarr
  make: soarr.lfsr_scrambler(${seed}, ${register_length})

parameters:
- id: seed
  label: Seed
  dtype: int
  default: 0xFF
- id: register_length
  label: Register Length
  dtype: int
  default: 8

inputs:
- label: in
  domain: message
  optional: 0

outputs:
- label: out
  domain: message
  optional: 0

documentation: |-
  Applies the CCSDS 231.0-B-3 TC pseudo-randomizer. The sequence restarts from Seed for every frame.

  Ports:
  - in: one transfer frame per PDU, from crc_append.
  - out: the randomized frame, metadata unchanged, for bch_encoder.

file_format: 1
