id: soarr_sdls_decryption
label: SDLS Decryption
category: '[soarr]/SDLS'

templates:
  imports: from gnuradio import soarr
  make: soarr.sdls_decryption(${decryption_state}, bytes.fromhex('{:028x}'.format(${nonce_hex})))

parameters:
- id: decryption_state
  label: Decryption State
  dtype: enum
  options: ['True', 'False']
  option_labels: [Enabled, Disabled]
  default: 'True'
  
- id: nonce_hex
  label: Nonce
  dtype: int
  default: 0

asserts:
- ${ nonce_hex >= 0 and nonce_hex <= 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFF }

inputs:
- label: in
  domain: message
  optional: 0

outputs:
- label: out
  domain: message
  optional: 0

documentation: |-
  Decrypts the payload with AES-256-CTR (CCSDS 355.0-B-1 SDLS). Nonce must match the one used by sdls_encryption.

  Ports:
  - in: verified ciphertext with crypt_key and sdls_counter in the metadata, from sdls_authentication_verify.
  - out: the plaintext. crypt_key is removed from the metadata.

file_format: 1
