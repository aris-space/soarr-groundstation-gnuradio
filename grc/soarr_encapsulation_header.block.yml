id: soarr_encapsulation_header
label: Encapsulation Header
category: '[soarr]/Encapsulation'

templates:
  imports: from gnuradio import soarr
  make: soarr.encapsulation_header(${user_defined_field})

parameters:
- id: user_defined_field
  label: User Defined Field
  dtype: int
  default: 0b0000

asserts:
- ${ user_defined_field >= 0 and user_defined_field <= 0b1111 }

inputs:
- label: in
  domain: message
  optional: 0

outputs:
- label: out
  domain: message
  optional: 0

documentation: |-
  Prepends a CCSDS 133.1-B encapsulation packet header to each payload. The header variant is chosen from the payload length.

  Ports:
  - in: the command payload, from inject_db.
  - out: header + payload, metadata unchanged, for sdls_encryption.

file_format: 1
