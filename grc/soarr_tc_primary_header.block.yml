id: soarr_tc_primary_header
label: TC Primary Header
category: '[soarr]/Telecommand'

templates:
  imports: from gnuradio import soarr
  make: soarr.tc_primary_header(${scid}, ${vcid}, ${is_crc_used})

parameters:
- id: scid
  label: Default SCID
  dtype: int
  default: 0
- id: vcid
  label: Default VCID
  dtype: int
  default: 0
- id: is_crc_used
  label: Is CRC Used
  dtype: enum
  options: ['False', 'True']
  option_labels: [No, Yes]
  default: True

asserts:
- ${ scid >= 0 and scid <= 0x3FF }
- ${ vcid >= 0 and vcid <= 0x3F }

inputs:
- label: in
  domain: message
  optional: 0

outputs:
- label: out
  domain: message
  optional: 0

documentation: |-
  Builds the 5-byte CCSDS 232.0-B TC transfer frame primary header from the metadata (SCID, VCID, bypass/control flags, frame sequence number) and prepends it. With Is CRC Used, the frame length includes the 2-byte FECF that crc_append adds next.

  Ports:
  - in: the SDLS-protected payload, from sdls_header.
  - out: header + payload, for crc_append.

file_format: 1
