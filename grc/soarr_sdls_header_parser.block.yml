id: soarr_sdls_header_parser
label: SDLS Header Parser
category: '[Soarr]/Common/SDLS'

templates:
  imports: from gnuradio import soarr
  make: soarr.sdls_header_parser()

inputs:
- label: in
  domain: message
  optional: 0

outputs:
- label: out
  domain: message
  optional: 0

documentation: |-
  Reads and strips the CCSDS 355.0-B-1 SDLS security header at the start of the payload: SPI (2 bytes) + IV (the 2-byte sdls_counter), as SDLS Header Adder builds it. The fields go into the metadata under sdls.security_header (spi, security_param_index, sdls_counter, initialization_vector), where Key Database (RX) and SDLS Process look for them.

  On TC, CCSDS Reader parses the security header itself; this block is for chains without it, such as TM:
  TX: Key Database (TX) -> SDLS Apply -> Encapsulation Header Adder -> TM Frame Encoder
  RX: TM Frame Decoder -> Encapsulation Parser -> SDLS Header Parser -> Key Database (RX) -> SDLS Process
  The encapsulation header after SDLS Apply gives the TM frame layer the length of the protected data.

  Ports:
  - in: security header + (encrypted) data [+ MAC].
  - out: (encrypted) data [+ MAC], the header's fields in the metadata. The MAC stays in the payload; SDLS Process takes it from the last 16 bytes.

file_format: 1
