id: soarr_sdls_authentication_verify
label: SDLS Authentication Verify
category: '[soarr]/SDLS'

templates:
  imports: from gnuradio import soarr
  make: soarr.sdls_authentication_verify(${authentication_state}, bytes.fromhex('{:028x}'.format(${nonce_hex})))

parameters:
- id: authentication_state
  label: Authentication State
  dtype: enum
  options: ['True', 'False']
  option_labels: [Enabled, Disabled]
  default: 'True'
- id: nonce_hex
  label: Nonce
  dtype: int
  default: 0

asserts:
- ${ nonce_hex >= 0 and nonce_hex <= 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFF }

inputs:
- label: in
  domain: message
  optional: 0

outputs:
- label: out
  domain: message
  optional: 0

documentation: |-
  Verifies and strips the AES-CMAC tag appended by sdls_authentication (CCSDS 355.0-B-1 SDLS). Frames with a wrong tag are dropped.

  Ports:
  - in: tagged payload with auth_key and sdls_counter in the metadata, from the RX inject_db.
  - out: the verified payload without the tag, for sdls_decryption. auth_key is removed from the metadata.

  Must come before sdls_decryption: the tag is computed over the encrypted bytes.

file_format: 1
