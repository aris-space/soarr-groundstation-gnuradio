id: soarr_cltu_framer
label: CLTU Framer
category: '[soarr]/CLTU'

templates:
  imports: from gnuradio import soarr
  make: soarr.cltu_framer(${start_sequence}, ${tail_sequence})

parameters:
- id: start_sequence
  label: Start Sequence
  dtype: int
  default: 0xEB90
- id: tail_sequence
  label: Tail Sequence
  dtype: int
  default: 0xC5C5C5C5C5C5C579

inputs:
- label: in
  domain: message
  optional: 0

outputs:
- label: out
  domain: message
  optional: 0

documentation: |-
  Wraps all codewords of a transfer frame into one CLTU (CCSDS 231.0-B-4): start sequence + codewords + tail sequence.

  Ports:
  - in: the codewords of one frame, from bch_encoder (a multiple of 8 bytes).
  - out: one CLTU per frame, metadata unchanged, for acquisition_idle_sequencer.

file_format: 1
