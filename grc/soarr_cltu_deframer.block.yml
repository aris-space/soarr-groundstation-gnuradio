id: soarr_cltu_deframer
label: CLTU Deframer
category: '[soarr]/CLTU'

templates:
  imports: from gnuradio import soarr
  make: soarr.cltu_deframer(${start_sequence}, ${tail_sequence}, ${payload_bytes}, ${threshold}, ${input_packed}, ${output_packed}, ${tag_name}, ${max_codewords})

parameters:
- id: start_sequence
  label: Start Sequence
  dtype: int
  default: 0xEB90

- id: tail_sequence
  label: Tail Sequence
  dtype: int
  default: 0xC5C5C5C5C5C5C579

- id: payload_bytes
  label: Codeword Length (bytes)
  dtype: int
  default: 8

- id: threshold
  label: Threshold
  dtype: int
  default: 2

- id: input_packed
  label: Packed Input
  dtype: enum
  options: ['False', 'True']
  option_labels: ['No', 'Yes']
  default: 'True'

- id: output_packed
  label: Packed Output
  dtype: enum
  options: ['False', 'True']
  option_labels: ['No', 'Yes']
  default: 'True'

- id: tag_name
  label: Tag Name
  dtype: string
  default: start

- id: max_codewords
  label: Max Codewords per CLTU
  dtype: int
  default: 147

asserts:
- ${ threshold >= 0 and threshold <= payload_bytes * 8 }
- ${ start_sequence >= 0 and start_sequence <= 0xFFFFFFFF }
- ${ tail_sequence >= 0 and tail_sequence <= 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF }
- ${ payload_bytes > 0 and payload_bytes <= 255 }
- ${ max_codewords > 0 }
- ${ not input_packed or (payload_bytes % 8 == 0) }
- ${ not output_packed or (payload_bytes % 8 == 0) }

inputs:
- label: in
  domain: stream
  dtype: byte

outputs:
- label: out
  domain: message

documentation: |-
  Finds CLTUs (CCSDS 231.0-B-4) in the received stream: a start sequence, one or more codewords, and a tail sequence. Start and tail are accepted with up to Threshold bit errors.

  Ports:
  - in: byte stream (Packed Input = Yes) or bit stream, typically after a Correlate Access Code - Tag block whose tag name matches Tag Name.
  - out: one PDU per codeword, sent once the CLTU's tail is found. The first codeword of each CLTU carries scramble_reset = True.

  A start sequence without a tail within Max Codewords per CLTU is discarded.

file_format: 1
