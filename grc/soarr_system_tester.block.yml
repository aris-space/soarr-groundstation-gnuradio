id: soarr_system_tester
label: System Tester
category: '[soarr]'

templates:
  imports: from gnuradio import soarr
  make: soarr.system_tester(${repetitions}, ${mode}, ${timeout_s}, ${stats_path})

parameters:
- id: repetitions
  label: Repetitions
  dtype: int
  default: 100
- id: mode
  label: Mode
  dtype: int
  default: 0
- id: timeout_s
  label: Timeout (s)
  dtype: float
  default: 1.0
- id: stats_path
  label: Statistics Path
  dtype: string
  default: "system_tester_stats.json"

inputs:
- label: start
  domain: message
  optional: 0

- label: original
  domain: message
  optional: 0

- label: transmitted
  domain: message
  optional: 0

- label: received
  domain: message
  optional: 0

outputs:
- label: trigger
  domain: message
  optional: 0

documentation: |-
  Measures bit error rate, message error rate and lost packets in a loopback test, by comparing sent and received payloads. Packets are matched by the vcid_counter in the telecommand.tc_header metadata.

  Ports:
  - start: any message starts a new test packet.
  - original: the payload as generated (reference).
  - transmitted: the payload as sent (reference if original is missing).
  - received: the payload as received back.
  - trigger: requests the next payload, e.g. from data_creator's ping.

file_format: 1
