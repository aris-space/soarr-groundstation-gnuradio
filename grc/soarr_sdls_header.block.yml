id: soarr_sdls_header
label: SDLS Header
category: '[soarr]/SDLS'

templates:
  imports: from gnuradio import soarr
  make: soarr.sdls_header()

#  iv_length_bytes keeps its default, sdls_constants.SDLS_COUNTER_BYTES -
#  the counter width the SDLS crypto blocks use - and is not GRC-exposed,
#  since any other value raises ValueError at construction (same pattern
#  as bch_decoder's fixed mode parameter).

inputs:
- label: in
  domain: message
  optional: 0

outputs:
- label: out
  domain: message
  optional: 0

documentation: |-
  Prepends the CCSDS 355.0-B-1 SDLS security header: SPI (2 bytes) + IV (the 2-byte sdls_counter).

  Ports:
  - in: authenticated payload with spi and sdls_counter in the metadata, from sdls_authentication.
  - out: header + payload, for tc_primary_header. spi and sdls_counter are removed from the metadata.

file_format: 1
