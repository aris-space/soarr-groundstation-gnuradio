id: soarr_ccsds_reader
label: CCSDS Reader
category: '[soarr]/Reception'

templates:
  imports: from gnuradio import soarr
  make: soarr.ccsds_reader(int(${sdls_type}), ${encapsulation_used}, int(${data_type}))

parameters:
- id: sdls_type
  label: SDLS Security Type
  dtype: enum
  default: '3'
  options: ['0', '1', '2', '3']
  option_labels: ['No SDLS', 'Encryption Only', 'Authentication Only', 'Both (Encryption + Auth)']

- id: encapsulation_used
  label: Encapsulation Header
  dtype: bool
  options: ['True', 'False']
  option_labels: [Activated, Deactivated]
  default: True

- id: data_type
  label: Data Type
  dtype: enum
  default: '0'
  options: ['0', '1']
  option_labels: ['Raw', 'CSP (Cubesat Space Protocol)']

inputs:
- label: ccsds
  domain: message

outputs:
- label: debug
  domain: message

documentation: |-
  Parses a reassembled TC transfer frame: primary header, optional encapsulation/SDLS headers, data, optional SDLS trailer and FECF. The parsed fields become PDU metadata.

  Ports:
  - ccsds: one complete transfer frame per PDU, from ccsds_receiver (via crc_check).
  - debug: the extracted data with the parsed fields as metadata. Despite its name this is the block's regular output; connect it to the RX inject_db.

file_format: 1
