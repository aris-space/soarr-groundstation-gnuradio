id: soarr_sdls_encryption
label: SDLS Encryption
category: '[soarr]/SDLS'

templates:
  imports: from gnuradio import soarr
  make: soarr.sdls_encryption(${encryption_state}, bytes.fromhex('{:028x}'.format(${nonce_hex})))

parameters:
- id: encryption_state
  label: Encryption State
  dtype: enum
  options: ['True', 'False']
  option_labels: [Enabled, Disabled]
  default: 'True'
- id: nonce_hex
  label: Nonce
  dtype: int
  default: 0

asserts:
- ${ nonce_hex >= 0 and nonce_hex <= 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFF }

inputs:
- label: in
  domain: message
  optional: 0

outputs:
- label: out
  domain: message
  optional: 0

documentation: |-
  Encrypts the payload with AES-256-CTR (CCSDS 355.0-B-1 SDLS). The 16-byte counter block is Nonce (14 bytes, never transmitted) + sdls_counter (2 bytes, sent as the IV).

  Ports:
  - in: payload with crypt_key and sdls_counter in the metadata, from encapsulation_header.
  - out: the ciphertext, for sdls_authentication. crypt_key is removed from the metadata.

file_format: 1
