id: soarr_ccsds_receiver
label: CCSDS Receiver
category: '[soarr]/Reception'

templates:
  imports: from gnuradio import soarr
  make: soarr.ccsds_receiver(${message_type}, ${field_type}, ${fixed_byte_length}, ${scid}, ${vcid}, ${scid_filter_enable}, ${vcid_filter_enable})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: message_type
  label: Message Type
  dtype: enum
  options: ['0', '1', '2']
  option_labels: [TC, TM, Fixed Length]
  default: '0'

- id: field_type
  label: Field Type
  dtype: enum
  options: ['0', '1']
  option_labels: [TC Field, Encapsulation Field]
  default: '0'
  hide: ${ 'all' if message_type != '0' else 'none' }

- id: fixed_byte_length
  label: Fixed Byte Length
  dtype: int
  default: 0
  hide: ${ 'all' if message_type != '2' else 'none' }

- id: scid_filter_enable
  label: SCID Filter
  dtype: enum
  options: ['False', 'True']
  option_labels: [Disabled, Enabled]
  default: 'False'

- id: scid
  label: Spacecraft Identifier
  dtype: int
  default: 0
  hide: ${ 'none' if scid_filter_enable == 'True' else 'all' }

- id: vcid_filter_enable
  label: VCID Filter
  dtype: enum
  options: ['False', 'True']
  option_labels: [Disabled, Enabled]
  default: 'False'

- id: vcid
  label: Virtual Channel Identifier
  dtype: int
  default: 0
  hide: ${ 'none' if vcid_filter_enable == 'True' else 'all' }



#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)

asserts:
- ${ message_type != '1'} # Not implemented yet
- ${ field_type != '1' } # Not implemented yet
- ${ fixed_byte_length >= 0}
- ${ fixed_byte_length < 2**10 }
- ${ scid >= 0}
- ${ scid < 2**10}
- ${ vcid >= 0}
- ${ vcid < 2**8}


inputs:
- label: in
  domain: message
  optional: 0

outputs:
- label: out
  domain: message
  optional: 0

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
