id: soarr_bch_decoder
label: BCH Decoder
category: '[soarr]/CLTU'

templates:
  imports: from gnuradio import soarr
  make: soarr.bch_decoder(0, int(${generator_polynomial}))

parameters:
- id: generator_polynomial
  label: Generator Polynomial
  dtype: int
  default: 0XC5

inputs:
- label: in
  domain: message
  optional: 0

outputs:
- label: out
  domain: message
  optional: 0

documentation: |-
  Corrects up to 2 bit errors in a CCSDS 231.0-B-4 BCH (63,56) codeword and outputs its 7 information bytes. Uncorrectable codewords are dropped.

  Ports:
  - in: one 8-byte codeword per PDU, e.g. from cltu_deframer.
  - out: the corrected 7 information bytes, metadata unchanged.

  ccsds_receiver runs this decoder internally; use this block to test the BCH layer on its own.

file_format: 1
