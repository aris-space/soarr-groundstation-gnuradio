id: soarr_acquisition_idle_sequencer
label: Acquisition and Idle Sequencer
category: '[soarr]'

templates:
  imports: from gnuradio import soarr
  make: soarr.acquisition_idle_sequencer(${idle_sequence}, ${acquisition_sequence}, ${initial_acquisition}, ${diff_encoded}, ${tsb_tag_name}, ${max_idle_chunk})

parameters:
- id: diff_encoded
  label: Diff. Encoding
  dtype: bool
  default: 'False'
  options: ['True', 'False']
  option_labels: ['Yes', 'No']

- id: idle_sequence
  label: Idle Sequence Byte
  dtype: int
  default: 0xAA

- id: acquisition_sequence
  label: Acquisition Sequence Array
  dtype: int_vector
  default: [0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA]

- id: initial_acquisition
  label: Initial Acquisition
  dtype: bool
  default: 'False'
  options: ['True', 'False']
  option_labels: ['Yes', 'No']

- id: tsb_tag_name
  label: UHD TSB Tag Name
  dtype: string
  default: packet_len

- id: max_idle_chunk
  label: Max Idle Chunk (bytes)
  dtype: int
  default: 64

inputs:
- label: in
  domain: message

- label: trigger_acq
  domain: message
  optional: true

outputs:
- label: out
  domain: stream
  dtype: byte

documentation: |-
  Turns framed CLTU PDUs into the continuous byte stream the modulator needs. The only stream block of the TX chain.

  Ports:
  - in: CLTU PDUs from cltu_framer; payloads are queued and sent back to back.
  - trigger_acq (optional): any message requests an acquisition sequence before the next CLTU.
  - out: continuous byte stream; idle-fill bytes are sent while nothing is queued.

file_format: 1
