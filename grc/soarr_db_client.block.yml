id: soarr_db_client
label: DB Client
category: '[soarr]/Database'

templates:
  imports: from gnuradio import soarr
  make: soarr.db_client(${type}, ${ip}, ${port}, ${yaml_path}, ${forward_body}, ${auto_reset_counters}, ${scid}, ${spi}, ${vcid}, ${crypt_key}, ${auth_key}, ${sdls_counter}, ${vcid_counter}, ${key_state_enc}, ${key_state_auth})

parameters:
- id: type
  label: DB Mode
  dtype: enum
  options: ['0', '1', '2']
  option_labels: [Dummy (fixed values), Local YAML, Remote DB (stub)]
  default: '0'
  
- id: ip
  label: Remote DB IP
  dtype: string
  default: 127.0.0.1
  hide: ${ 'none' if type == '2' else 'all' }

- id: port
  label: Remote DB Port
  dtype: int
  default: 80
  hide: ${ 'none' if type == '2' else 'all' }

- id: yaml_path
  label: Local YAML File
  dtype: file_open
  default: ""
  hide: ${ 'none' if type == '1' else 'all' }

- id: forward_body
  label: Forward Message Body
  dtype: enum
  options: ['True', 'False']
  option_labels: [Enabled, Disabled]
  default: 'True'

- id: auto_reset_counters
  label: Auto Reset Counters
  dtype: enum
  options: ['True', 'False']
  option_labels: [Enabled, Disabled]
  default: 'False'
  hide: ${ 'part' if type == '0' else 'all' }

- id: scid
  label: Dummy SCID
  dtype: int
  default: 341
  hide: ${ 'part' if type == '0' else 'all' }

- id: spi
  label: Dummy SPI
  dtype: int
  default: 1
  hide: ${ 'part' if type == '0' else 'all' }

- id: vcid
  label: Dummy VCID
  dtype: int
  default: 18
  hide: ${ 'part' if type == '0' else 'all' }

- id: crypt_key
  label: Dummy Crypt Key
  dtype: string
  default: 00112233445566778899AABBCCDDEEFF00112233445566778899AABBCCDDEEFF
  hide: ${ 'part' if type == '0' else 'all' }

- id: auth_key
  label: Dummy Auth Key
  dtype: string
  default: FFEEDDCCBBAA99887766554433221100FFEEDDCCBBAA99887766554433221100
  hide: ${ 'part' if type == '0' else 'all' }

- id: sdls_counter
  label: Dummy SDLS Counter
  dtype: int
  default: 0
  hide: ${ 'part' if type == '0' else 'all' }

- id: vcid_counter
  label: Dummy VCID Counter
  dtype: int
  default: 0
  hide: ${ 'part' if type == '0' else 'all' }

- id: key_state_enc
  label: Dummy Key State Enc
  dtype: string
  default: active
  hide: ${ 'part' if type == '0' else 'all' }

- id: key_state_auth
  label: Dummy Key State Auth
  dtype: string
  default: active
  hide: ${ 'part' if type == '0' else 'all' }

asserts:
- ${ type == '0' or type == '1' or type == '2' }

inputs:
- label: db_call
  domain: message
  optional: 0

outputs:
- label: db_callback
  domain: message
  optional: 0

documentation: |-
  Serves keys, SPIs and counters for inject_db, looked up by SCID + SPI.

  DB Mode:
  - Dummy: one entry built from the Dummy parameters below.
  - Local YAML: entries from a YAML file (see examples/db_client_example.yaml).
  - Remote DB: not implemented; falls back to the dummy entry.

  Ports:
  - db_call: queries from inject_db.
  - db_callback: the answers, to inject_db.

  The SDLS counter is 16 bits; once an entry has used all values, its requests are refused until a new key is loaded. The VCID counter (frame sequence number) wraps from 255 to 0. Auto Reset Counters reuses SDLS counters: test use only.

file_format: 1
