id: soarr_data_creator
label: Data Creator
category: '[soarr]/Testing'

templates:
  imports: from gnuradio import soarr
  make: soarr.data_creator(int(${mode}), ${data if payload_source == 'manual' else None}, ${int(data_length_bytes) if payload_source == 'random' else None}, int(${scid}), int(${spi}), ${bypass}, ${control}, int(${vcid}), int(${vcid_counter}), int(${sdls_counter}))

parameters:
- id: mode
  label: Mode
  dtype: enum
  default: '0'
  options: ['0']
  option_labels: ['Random/Configured Payload']

- id: payload_source
  label: Payload Source
  dtype: enum
  default: random
  options: [random, manual]
  option_labels: ['Random (length-based)', 'Manual data']

- id: data
  label: Data (manual int/bytes/list)
  dtype: raw
  default: None
  hide: ${ 'part' if payload_source == 'manual' else 'all' }

- id: data_length_bytes
  label: Data Length (bytes, random or pad)
  dtype: int
  default: 64
  hide: ${ 'none' if payload_source == 'random' else 'all' }

- id: scid
  label: SCID
  dtype: int
  default: 0

- id: spi
  label: SPI
  dtype: int
  default: 0

- id: bypass
  label: Bypass
  dtype: bool
  options: ['True', 'False']
  option_labels: ['True', 'False']
  default: 'False'

- id: control
  label: Control
  dtype: bool
  options: ['True', 'False']
  option_labels: ['True', 'False']
  default: 'False'

- id: vcid
  label: VCID
  dtype: int
  default: 0

- id: vcid_counter
  label: VCID Counter
  dtype: int
  default: 0

- id: sdls_counter
  label: SDLS Counter
  dtype: int
  default: 0
inputs:
- label: ping
  domain: message

outputs:
- label: out
  domain: message

documentation: |-
  Generates test payloads, with the transfer frame and SDLS header fields set in the metadata, as an alternative to a real command source.

  Ports:
  - ping: any message triggers one payload (e.g. from system_tester's trigger).
  - out: the generated PDU.

file_format: 1
