id: soarr_lfsr_descrambler
label: LFSR Descrambler
category: '[soarr]/LFSR'

templates:
  imports: from gnuradio import soarr
  make: soarr.lfsr_descrambler(${seed}, ${register_length})

parameters:
- id: seed
  label: Seed
  dtype: int
  default: 0xFF
- id: register_length
  label: Register Length
  dtype: int
  default: 8

inputs:
- label: in
  domain: message
  optional: 0

outputs:
- label: out
  domain: message
  optional: 0

documentation: |-
  Reverses the CCSDS 231.0-B-3 TC pseudo-randomization (same sequence as lfsr_scrambler). The sequence runs on across messages and restarts when a PDU carries scramble_reset = True, as cltu_deframer sets it on each CLTU's first codeword.

  Ports:
  - in: data to de-randomize, e.g. from bch_decoder.
  - out: the de-randomized data, metadata unchanged.

  ccsds_receiver runs this descrambler internally; use this block to test the layer on its own.

file_format: 1
