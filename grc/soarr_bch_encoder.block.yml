id: soarr_bch_encoder
label: BCH Encoder
category: '[soarr]/CLTU'

templates:
  imports: from gnuradio import soarr
  make: soarr.bch_encoder(${polynomial})

parameters:
- id: polynomial
  label: Generator Polynomial
  dtype: int
  default: 0xC5

inputs:
- label: message
  domain: message
  optional: 0

outputs:
- label: codewords
  domain: message
  optional: 0

documentation: |-
  Encodes a frame with the CCSDS 231.0-B-4 BCH (63,56) code: 7 parity bits and 1 filler bit per 56 information bits, with the last block padded by fill bits.

  Ports:
  - message: one scrambled transfer frame per PDU, from lfsr_scrambler.
  - codewords: all codewords of that frame in one PDU (8 bytes each), for cltu_framer. Adds "filled" to the metadata: whether fill bits were needed.

file_format: 1
