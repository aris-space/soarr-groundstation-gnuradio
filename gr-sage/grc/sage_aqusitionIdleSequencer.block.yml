id: sage_aqusitionIdleSequencer
label: Acquisition and Idle Sequencer
category: '[sage]'

templates:
  imports: from gnuradio import sage
  make: sage.aqusitionIdleSequencer(${idle_sequence}, ${acquisition_sequence}, ${initial_acquisition}, ${diff_encoded}, ${tsb_tag_name})

parameters:
- id: diff_encoded
  label: Diff. Encoding
  dtype: bool
  default: 'False'
  options: ['True', 'False']
  option_labels: ['Yes', 'No']

- id: idle_sequence
  label: Idle Sequence Byte
  dtype: int
  default: 0xAA

- id: acquisition_sequence
  label: Acquisition Sequence Array
  dtype: int_vector
  default: [0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA]

- id: initial_acquisition
  label: Initial Acquisition
  dtype: bool
  default: 'False'
  options: ['True', 'False']
  option_labels: ['Yes', 'No']

- id: tsb_tag_name
  label: UHD TSB Tag Name
  dtype: string
  default: packet_len

inputs:
- label: in
  domain: message

- label: trigger_acq
  domain: message
  optional: true

outputs:
- label: out
  domain: stream
  dtype: byte

file_format: 1
