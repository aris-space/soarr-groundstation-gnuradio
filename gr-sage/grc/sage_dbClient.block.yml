id: sage_dbClient
label: DB Client
category: '[sage]/Database'

templates:
  imports: from gnuradio import sage
  make: sage.dbClient(${type}, ${ip}, ${port}, ${yaml_path}, ${forward_body}, ${scid}, ${spi}, ${vcid}, ${crypt_key}, ${auth_key}, ${sdls_counter}, ${vcid_counter}, ${key_state_enc}, ${key_state_auth})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: type
  label: DB Mode
  dtype: enum
  options: ['0', '1', '2']
  option_labels: [Dummy (fixed values), Local YAML, Remote DB (stub)]
  default: '0'
- id: ip
  label: Remote DB IP
  dtype: string
  default: 127.0.0.1
  hide: ${ 'none' if type == '2' else 'all' }
- id: port
  label: Remote DB Port
  dtype: int
  default: 80
  hide: ${ 'none' if type == '2' else 'all' }
- id: yaml_path
  label: Local YAML File
  dtype: file_open
  default: ""
  hide: ${ 'none' if type == '1' else 'all' }
- id: forward_body
  label: Forward Message Body
  dtype: enum
  options: ['True', 'False']
  option_labels: [Enabled, Disabled]
  default: 'True'
- id: scid
  label: Dummy SCID
  dtype: int
  default: 341
  hide: ${ 'none' if type == '0' else 'all' }
- id: spi
  label: Dummy SPI
  dtype: int
  default: 1
  hide: ${ 'none' if type == '0' else 'all' }
- id: vcid
  label: Dummy VCID
  dtype: int
  default: 18
  hide: ${ 'none' if type == '0' else 'all' }
- id: crypt_key
  label: Dummy Crypt Key
  dtype: string
  default: 00112233445566778899AABBCCDDEEFF00112233445566778899AABBCCDDEEFF
  hide: ${ 'none' if type == '0' else 'all' }
- id: auth_key
  label: Dummy Auth Key
  dtype: string
  default: FFEEDDCCBBAA99887766554433221100FFEEDDCCBBAA99887766554433221100
  hide: ${ 'none' if type == '0' else 'all' }
- id: sdls_counter
  label: Dummy SDLS Counter
  dtype: int
  default: 0
  hide: ${ 'none' if type == '0' else 'all' }
- id: vcid_counter
  label: Dummy VCID Counter
  dtype: int
  default: 0
  hide: ${ 'none' if type == '0' else 'all' }
- id: key_state_enc
  label: Dummy Key State Enc
  dtype: string
  default: active
  hide: ${ 'none' if type == '0' else 'all' }
- id: key_state_auth
  label: Dummy Key State Auth
  dtype: string
  default: active
  hide: ${ 'none' if type == '0' else 'all' }

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)

asserts:
- ${ type == '0' or type == '1' or type == '2' }



inputs:
- label: db_call
  domain: message
  optional: 0

outputs:
- label: db_callback
  domain: message
  optional: 0

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
