id: sage_ccsdsReader
label: CCSDS Reader
category: '[sage/Testing]'

templates:
  imports: from gnuradio import sage
  make: sage.ccsdsReader(int(${message_type}), int(${sdls_type}), ${encapsulation_used}, int(${data_type}))

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: message_type
  label: Message Type
  dtype: enum
  default: '0'
  options: ['0', '1']
  option_labels: ['TC (Telecommand)', 'TM (Telemetry)']

- id: sdls_type
  label: SDLS Security Type
  dtype: enum
  default: '3'
  options: ['0', '1', '2', '3']
  option_labels: ['No SDLS', 'Encryption Only', 'Authentication Only', 'Both (Encryption + Auth)']

- id: encapsulation_used
  label: Encapsulation Header
  dtype: bool
  default: True

- id: data_type
  label: Data Type
  dtype: enum
  default: '0'
  options: ['0', '1']
  option_labels: ['Raw', 'CSP (Cubesat Space Protocol)']

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: ccsds
  domain: message

outputs:
- label: debug
  domain: message
#  optional: ...

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
