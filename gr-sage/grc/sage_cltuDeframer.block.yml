id: sage_cltuDeframer
label: CLTU Deframer
category: '[sage]/CLTU'

templates:
  imports: from gnuradio import sage
  make: sage.cltuDeframer(${start_sequence}, ${tail_sequence}, ${payload_bytes}, ${threshold}, ${input_packed}, ${output_packed})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: start_sequence
  label: Start Sequence
  dtype: int
  default: 0xEB90
- id: tail_sequence
  label: Tail Sequence
  dtype: int
  default: 0xC5C5C5C5C5C5C579
- id: payload_bytes
  label: Payload Bytes
  dtype: int
  default: 8
- id: threshold
  label: Threshold
  dtype: int
  default: 2
- id: input_packed
  label: Packed Input
  dtype: bool
  default: True
- id: output_packed
  label: Packed Output
  dtype: bool
  default: True


#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)

asserts:
- ${ threshold >= 0 and threshold <= payload_bytes * 8 }
- ${ start_sequence >= 0 and start_sequence <= 0xFFFFFFFF }
- ${ tail_sequence >= 0 and tail_sequence <= 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF }
- ${ payload_bytes > 0 and payload_bytes <= 255 }
- ${ not input_packed or (payload_bytes % 8 == 0) }
- ${ not output_packed or (payload_bytes % 8 == 0) }


inputs:
- label: in
  domain: stream
  dtype: byte

outputs:
- label: out
  domain: message

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
