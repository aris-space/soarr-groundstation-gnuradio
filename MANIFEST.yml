description: |-
  gr-soarr is a pure-Python GNU Radio out-of-tree module implementing the
  ground-station side of a CCSDS Telecommand (TC) uplink for ARIS's SOARR
  mission.

  **TX chain:** CCSDS 133.1-B encapsulation packet, SDLS (CCSDS 355.0-B-1)
  AES-256-CTR encryption and AES-CMAC authentication, SDLS security header,
  TC transfer frame primary header, CCSDS 231.0-B pseudo-randomization,
  BCH (63,56) encoding, CLTU framing, and acquisition/idle sequence
  insertion for a continuous byte stream to the modulator.

  **RX chain:** CLTU detection, BCH error correction, de-randomization,
  transfer-frame reassembly, frame parsing, SDLS tag verification, and
  decryption.

  Key material and counters come from a pluggable lookup block
  (in-memory or YAML file), and a loopback tester reports bit error rate,
  message error rate, and lost packets.
file_format: 1
