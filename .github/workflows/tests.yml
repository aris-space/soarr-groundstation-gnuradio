# Runs the test suite, and for pull requests into the protected branches
# checks that they come from the allowed branch (docs/development.md,
# "Branches"). Both jobs are required status checks on testing and main.
name: tests

on:
  push:
    branches: [dev, "release/**"]
  pull_request:
    branches: [testing, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}  # login shell, so the micromamba environment is active
    steps:
      - uses: actions/checkout@v4

      # The same packages as radioconda (conda-forge), pinned to the
      # versions the suite is developed against.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: soarr
          condarc: |
            channels:
              - conda-forge
          create-args: >-
            python=3.12
            gnuradio=3.10.12
            gnuradio-satellites=5.9.0
            construct
            pyyaml
            pycryptodome
            numpy
            pytest
          cache-environment: true

      - name: Run pytest
        run: python -m pytest python/soarr -q

  source-branch:
    name: source-branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the pull request's source branch
        env:  # passed as variables, never pasted into the script
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE:$HEAD" in
            testing:release/*|main:testing)
              echo "$HEAD -> $BASE is allowed." ;;
            *)
              echo "::error::Pull requests into testing come from release/X.Y.Z, into main from testing; got $HEAD -> $BASE."
              exit 1 ;;
          esac
