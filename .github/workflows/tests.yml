# Runs the test suite. Its job, pytest, is a required status check on
# testing and main (docs/development.md, "Running tests").
name: tests

on:
  push:
    branches: [dev, "release/**"]
  pull_request:
    branches: [testing, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}  # login shell, so the micromamba environment is active
    steps:
      - uses: actions/checkout@v4

      # The same packages as radioconda (conda-forge), pinned to the
      # versions the suite is developed against.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: soarr
          condarc: |
            channels:
              - conda-forge
          create-args: >-
            python=3.12
            gnuradio=3.10.12
            gnuradio-satellites=5.9.0
            construct
            pyyaml
            pycryptodome
            numpy
            pytest
          cache-environment: true

      - name: Run pytest
        run: python -m pytest python/soarr -q
